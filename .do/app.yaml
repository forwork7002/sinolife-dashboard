# DigitalOcean App Platform specification.
#
#   doctl apps create --spec .do/app.yaml
#
# READ THIS BEFORE RE-APPLYING THE SPEC
# `doctl apps update --spec` REPLACES the whole app spec. The secrets below say
# CHANGE_ME, so applying this file as-committed over a running app overwrites
# every real secret with that literal string and the app stops at its next
# boot. To change something after creation, take the LIVE spec, edit it, and
# apply that — the live copy carries the secrets back as encrypted `EV[1:...]`
# values, which re-apply unchanged:
#
#   doctl apps spec get <app-id> > /tmp/live.yaml
#   $EDITOR /tmp/live.yaml
#   doctl apps update <app-id> --spec /tmp/live.yaml
#
# App Platform runs the app as a LONG-LIVED Node server, not as serverless
# functions. That matters: the Prisma pool in src/server/db/prisma.ts sizes
# itself down when it detects a serverless host, and here it should not — one
# process holding ten connections is the correct shape.

# The public hostname comes from this name: <name>-xxxxx.ondigitalocean.app.
#
# It is deliberately neutral. The name appears in DNS and in public
# certificate-transparency logs the moment TLS is issued, so anyone scanning
# those logs sees it — "sinolife-dashboard" would have announced both the
# company and what the site is. A neutral word plus a random suffix says
# neither.
#
# Be honest about the limit: this reduces casual discovery, it is NOT access
# control. Anyone who is handed the URL is exactly as close to the data as they
# were before, and a scanner walking the whole ondigitalocean.app namespace
# finds this as easily as it would have found any other name. The real boundary
# is the password policy, two-factor, the sign-in lockout and the rate limit —
# docs/SECURITY.md is the full list, and this line is not on it.
#
# Change it in one place and the hostname changes with it; the database cluster
# below carries the same word so the two stay recognisably one deployment.
name: meridian-61c3bf
region: fra

# ---------------------------------------------------------------------------
# App-level environment
#
# Declared ONCE here and inherited by the web service, the worker and both
# jobs. The previous shape repeated each secret in all four components, and a
# component-level value silently overrides the app-level one — so a real secret
# set in the dashboard kept losing to a CHANGE_ME left behind in a component.
# One declaration cannot disagree with itself.
# ---------------------------------------------------------------------------
envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}

  # DigitalOcean signs its database clusters with its own CA, and `pg` (unlike
  # libpq) verifies `sslmode=require` against the system trust store — so every
  # connection is refused until either this is set or verification is dropped.
  # Download it from the database page: Connection details → CA certificate.
  # Left unset, src/server/db/poolConfig.ts encrypts without verifying, which
  # is what sslmode=require means everywhere else.
  - key: DATABASE_CA_CERT
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: CHANGE_ME

  - key: DATA_SOURCE
    scope: RUN_AND_BUILD_TIME
    value: bitrix24

  # The URLs the platform already knows. Bound rather than typed, so attaching
  # a custom domain updates them without an edit.
  #
  # ${APP_URL} follows the PRIMARY domain. Once a custom domain is primary, the
  # original *.ondigitalocean.app address is no longer the auth origin and
  # signing in there returns 403 — add it to APP_TRUSTED_ORIGINS below if
  # anyone still uses it.
  - key: BETTER_AUTH_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: NEXT_PUBLIC_APP_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}

  # Comma-separated extra origins allowed to post to the auth endpoints.
  # Empty is correct for a single domain — see src/server/auth/trustedOrigins.ts.
  - key: APP_TRUSTED_ORIGINS
    scope: RUN_TIME
    value: ""

  # Which forwarding hops may set the client IP that rate limiting is keyed on.
  # Empty means "private address space", which is where App Platform's load
  # balancer connects from. See src/server/auth/trustedProxies.ts.
  - key: APP_TRUSTED_PROXIES
    scope: RUN_TIME
    value: ""

  # Session signing key — and, since two-factor arrived, the key the TOTP seeds
  # and the backup codes in `two_factor` are encrypted under.
  #
  #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  #
  # Rotating it signs everyone out. That used to be the entire consequence and
  # it is not any more: every enrolled authenticator becomes undecryptable at
  # the same instant, so after a rotation the owner signs in with the password
  # alone and has to arm 2FA again from /account. That is the correct order —
  # rotate, sign in, re-enrol — and it is also why rotation is a real step in
  # the compromise procedure rather than a formality. See docs/SECURITY.md.
  - key: BETTER_AUTH_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: CHANGE_ME

  # --- Two-factor and the sign-in lockout -----------------------------------
  #
  # Neither one adds a variable here, and the absence is a decision rather than
  # an omission:
  #
  #  * The second factor keeps its state in the database (`two_factor`),
  #    encrypted under BETTER_AUTH_SECRET above. TOTP is arithmetic over a
  #    shared seed, so there is no provider to configure — no SMS gateway, no
  #    mail sender, no third-party account, nothing to pay for and nothing that
  #    can be down.
  #  * The lockout thresholds — five failures, fifteen minutes doubling to a
  #    one-hour ceiling — are constants in src/server/auth/lockout.ts, with
  #    tests over the escalation. As env they would be the one limit that
  #    bounds a patient guesser, editable in a web form, with no diff, no
  #    review and no test run behind the edit.
  #  * The lockout COUNTER is in Postgres for a related reason: rate-limit
  #    counters live in this process's memory, and this app redeploys. A
  #    counter a deploy clears is a lock an attacker only has to outwait.
  #
  # One environment requirement is real and invisible. The web component must
  # be able to reach api.pwnedpasswords.com over HTTPS — that is the breach
  # check refusing a password that already appears in a public dump, and it
  # sends a five-character hash prefix, never the password. App Platform allows
  # outbound HTTPS by default. If that ever stops being true the check fails
  # OPEN on purpose (nobody else's outage may stand between the owner and a
  # password change), so the symptom is silence rather than an error.

  # The webhook URL embeds an access token to the whole portal.
  - key: BITRIX24_WEBHOOK_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: CHANGE_ME

  - key: BITRIX24_RATE_LIMIT_RPS
    scope: RUN_TIME
    value: "2"
  - key: BITRIX24_REQUEST_TIMEOUT_MS
    scope: RUN_TIME
    value: "30000"
  - key: BITRIX24_CALL_MONTHS
    scope: RUN_TIME
    value: "1"

  # Seconds between sync ticks, and how many ticks between reference-data reads.
  - key: SYNC_INTERVAL_SEC
    scope: RUN_TIME
    value: "60"
  - key: SYNC_REFERENCE_EVERY
    scope: RUN_TIME
    value: "30"

  # The single administrator account, created by the post-deploy job.
  - key: ADMIN_NAME
    scope: RUN_TIME
    value: Administrator
  - key: ADMIN_EMAIL
    scope: RUN_TIME
    type: SECRET
    value: CHANGE_ME
  - key: ADMIN_PASSWORD
    scope: RUN_TIME
    type: SECRET
    value: CHANGE_ME

  - key: APP_TIMEZONE
    scope: RUN_AND_BUILD_TIME
    value: Asia/Tashkent
  - key: APP_DEFAULT_LOCALE
    scope: RUN_AND_BUILD_TIME
    value: uz
  - key: APP_DEFAULT_CURRENCY
    scope: RUN_AND_BUILD_TIME
    value: UZS
  - key: LOG_LEVEL
    scope: RUN_TIME
    value: info

  # --- The marketing ledger -------------------------------------------------
  #
  # A SECOND source, deliberately configured apart from the Bitrix24 block
  # above. These figures come from the client's published Roistat page (their
  # Google Sheets plus Meta Ads) and are imported by `npm run roistat:import`.
  # Nothing here talks to the portal, and the two ledgers are never summed.
  #
  # Point this at a different URL and the module follows it; leave it unset and
  # the importer uses its built-in default.
  - key: ROISTAT_SOURCE_URL
    scope: RUN_TIME
    value: https://rustamov0277-cmd.github.io/roistat/

services:
  - name: web
    instance_size_slug: basic-xs
    instance_count: 1
    http_port: 3000

    github:
      # The REPOSITORY name is not the hostname and does not need renaming.
      # Only `name:` at the top of this file becomes DNS and a certificate; a
      # private repository's name appears in no public log (keeping it private
      # is step 1 of docs/DEPLOY.md, and is what that relies on). If it is ever
      # renamed on GitHub, all five of these blocks change together.
      repo: forwork7002/sinolife-dashboard
      branch: main
      deploy_on_push: true

    # `npm run build` runs `prisma generate` first. The generated client is not
    # committed, so a clean checkout cannot build without it.
    build_command: npm ci && npm run build
    run_command: npm run start

    health_check:
      # /api/health opens a database connection. The login page was the check
      # before, and it answers 200 out of the build output with the database
      # gone — a green light over an app that cannot serve a single number.
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

    envs:
      # RUN_TIME only, and this is the important part.
      #
      # Scoped to build time as well, `npm ci` obeys it and installs no
      # devDependencies — so `next build` cannot resolve @tailwindcss/postcss
      # and the build fails before it starts. Next sets NODE_ENV=production for
      # `next build` and `next start` on its own; the variable is here purely
      # so anything else that reads it at run time agrees.
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

workers:
  # Keeps the database within a minute of the portal.
  #
  # A worker rather than a scheduled job: a job pays Node and Prisma startup on
  # every run, which at a one-minute cadence is most of the minute. This holds
  # one process, one connection pool and one warm rate limiter.
  #
  # Exactly ONE instance. The worker holds a Postgres advisory lock on a
  # dedicated connection and a second copy waits rather than racing it, so
  # scaling this to two would simply leave one idle — and spend the portal's
  # rate limit twice over if the lock were ever removed.
  #
  # This worker also performs the FIRST import. On an empty database no entity
  # has a watermark yet, so the first tick reads everything — about sixteen
  # minutes — and every tick after it reads only what changed. Nothing has to
  # be run by hand.
  - name: sync
    instance_size_slug: basic-xxs
    instance_count: 1

    github:
      repo: forwork7002/sinolife-dashboard
      branch: main
      deploy_on_push: true

    build_command: npm ci && npx prisma generate

    # `npm run bitrix:worker` is `node --import tsx scripts/syncWorker.ts`,
    # deliberately without the `tsx` shim. The shim is a shell wrapper, and
    # `sh -c` does not forward SIGTERM to its child — so a stop signal reached
    # the wrapper, the wrapper died, and Node kept syncing until the platform
    # killed it thirty seconds later, mid-write. Straight to Node, the handler
    # in syncWorker.ts runs and the lock is released for the replacement.
    run_command: npm run bitrix:worker

    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

jobs:
  # Schema first, on every deploy, before the new code serves traffic.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: basic-xxs
    github:
      repo: forwork7002/sinolife-dashboard
      branch: main
    build_command: npm ci
    run_command: npm run db:deploy

  # The administrator account. Idempotent — it converges rather than resets,
  # so running it on every deploy cannot overwrite a password that works.
  #
  # It also cannot touch two-factor: enrolment is a `two_factor` row the owner
  # created from the browser, and this job neither reads nor writes it. A
  # redeploy therefore never disarms the second factor.
  - name: provision-admin
    kind: POST_DEPLOY
    instance_size_slug: basic-xxs
    github:
      repo: forwork7002/sinolife-dashboard
      branch: main
    build_command: npm ci && npx prisma generate
    run_command: npm run db:seed:users

  # The marketing ledger is filled by hand, NOT by the deploy.
  #
  # It used to be a POST_DEPLOY job, and that made a data refresh able to fail
  # a deployment: the importer downloads a 5.5 MB page and parses ~25k rows,
  # which a 512 MB job container did not survive, so a perfectly good release
  # was rolled back over a marketing table. A deploy should fail for broken
  # code, never for a second system's data.
  #
  # Run it from a console session when the client republishes their page:
  #     npm run roistat:import
  # It is idempotent and refuses a blob that shrank, so re-running is safe.

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: meridian-61c3bf-db
