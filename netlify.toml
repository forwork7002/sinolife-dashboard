# Netlify konfiguratsiyasi.
#
# Netlify Next.js'ni o'zi taniydi va @netlify/plugin-nextjs ni o'rnatadi —
# u sahifalarni va API yo'llarini serverless funksiyalarga aylantiradi.
# Bu yerda faqat Netlify o'zi taxmin qila olmaydigan narsalar yozilgan.

[build]
  # `npm run build` ichida `prisma generate` bor. Prisma klienti generatsiya
  # qilinadigan kod va git'ga kirmaydi, shuning uchun toza clone'da avval uni
  # yaratish kerak — busiz build "Cannot find module '@/generated/prisma/client'"
  # xatosi bilan yiqiladi.
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Loyiha Node 24 da yozilgan; Netlify'ning standarti eskiroq bo'lishi mumkin.
  NODE_VERSION = "22"
  # Prisma engine'lari o'rnatish skriptlari orqali yuklanadi.
  NPM_FLAGS = "--foreground-scripts"

# Xavfsizlik sarlavhalari next.config.ts da ham bor — bu statik fayllar va
# funksiyadan o'tmaydigan javoblar uchun ikkinchi qatlam.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
